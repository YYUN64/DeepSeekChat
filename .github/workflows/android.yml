name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 Release 需要写权限（仓库默认 token 是只读的）
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不依赖 runner 预装或第三方 action，直接装 Google 官方 cmdline-tools
      - name: Set up Android SDK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          tail -n 80 /tmp/build.log
          if [ "$code" -ne 0 ]; then
            # 把失败原因写成 annotation，方便在 API / 检查页面直接看到
            msg=$(grep -E "^(FAILURE|e: |\* What went wrong|Caused by:|Could not|> Could not)" -A3 /tmp/build.log | head -n 40 | tr '\n' '|' | cut -c1-900)
            echo "::error title=Gradle failed::$msg"
            exit "$code"
          fi

      - name: Verify fixed release signing
        run: |
          # 固定签名：keystore.properties + app/deepseek-lite.jks 都在仓库里，本机/CI 用同一把 key
          test -f keystore.properties
          test -f app/deepseek-lite.jks
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          # 固定证书 SHA-256（20:6C:32:70:...:B4:30），不一致直接失败
          grep -q "206c32700f8cfd07f45c4f8d3991d9794cf01006a77e8eea8ca1d7386ba4b430" /tmp/certs.txt \
            || { echo "::error title=Release signing::release APK 证书指纹与固定 keystore 不一致"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推 v* 标签时自动建 Release 并附上两个 APK
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DeepSeekLite-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "DeepSeekLite-${GITHUB_REF_NAME}-debug.apk"
          # Release 正文只放“本次改动”：优先 docs/release-notes/<tag>.md，
          # 其次 docs/release-notes.md，都没有就用一句兜底（功能列表放 README）
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="docs/release-notes.md"
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            printf '完整功能列表与用法见 [README](https://github.com/YYUN64/DeepSeekChat#readme)。\n' > /tmp/release-notes-fallback.md
            NOTES_FILE=/tmp/release-notes-fallback.md
          fi
          echo "Release notes: $NOTES_FILE"
          cat "$NOTES_FILE"
          if ! out=$(gh release create "${GITHUB_REF_NAME}" \
            "DeepSeekLite-${GITHUB_REF_NAME}.apk" \
            "DeepSeekLite-${GITHUB_REF_NAME}-debug.apk" \
            --title "DeepSeek Lite ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES_FILE" 2>&1); then
            echo "::error title=gh release failed::$(echo "$out" | head -n 5 | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          echo "$out"
