name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不依赖 runner 预装或第三方 action，直接装 Google 官方 cmdline-tools
      - name: Set up Android SDK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          tail -n 80 /tmp/build.log
          if [ "$code" -ne 0 ]; then
            # 把失败原因写成 annotation，方便在 API / 检查页面直接看到
            msg=$(grep -E "^(FAILURE|e: |\* What went wrong|Caused by:|Could not|> Could not)" -A3 /tmp/build.log | head -n 40 | tr '\n' '|' | cut -c1-900)
            echo "::error title=Gradle failed::$msg"
            exit "$code"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 推 v* 标签时自动建 Release 并附上两个 APK
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DeepSeekLite-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "DeepSeekLite-${GITHUB_REF_NAME}-debug.apk"
          gh release create "${GITHUB_REF_NAME}" \
            "DeepSeekLite-${GITHUB_REF_NAME}.apk" \
            "DeepSeekLite-${GITHUB_REF_NAME}-debug.apk" \
            --title "DeepSeek Lite ${GITHUB_REF_NAME}" \
            --notes "个人自用的 DeepSeek 安卓客户端，直连官方 API。

## 功能
- 图片上传（deepseek-flash 原生视觉）
- 推理等级 关闭 / 低 / 高 / 极致（对齐 DSH 的 off/low/high/max）
- 会话历史（本地 JSON，抽屉切换）
- 上下文长度 / 最大回复长度可调（16K~1M）
- 流式输出、思考过程折叠、Markdown、深色/浅色主题

## 安装
- \`DeepSeekLite-${GITHUB_REF_NAME}.apk\`：release 包，R8 优化，冷启动约 0.36 s（推荐）
- \`DeepSeekLite-${GITHUB_REF_NAME}-debug.apk\`：调试包，体积大、启动慢，仅用于排查

包名 \`io.github.yyun64.deepseekchat\`，可与官方 DeepSeek App 共存。release 包使用 debug keystore 签名，仅供个人侧载。"
